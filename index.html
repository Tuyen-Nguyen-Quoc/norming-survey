<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Khảo sát đánh giá từ vựng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="badges"></div>
  <header id="topbar" hidden>
    <div class="meta">
      <span id="progress-label"></span>
      <span id="progress-count"></span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progress-fill"></div>
    </div>
  </header>
  <div id="notice" role="status" hidden></div>
  <main id="app"></main>
  <noscript><p class="noscript">Vui lòng bật JavaScript để làm khảo sát.</p></noscript>

  <script src="config.js"></script>
  <script src="texts.js"></script>
  <script src="app.js"></script>
</body>
</html>
